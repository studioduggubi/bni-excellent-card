<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이미지 명함 정보 입력 · BNI 엑설런트</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f4f4f6}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{display:block;width:100%;height:100vh;height:100dvh;border:0}
#fallback{display:none;position:fixed;inset:0;z-index:2;background:#031341;color:#fff;
  align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center}
#fallback.on{display:flex}
#fallback .in{max-width:380px}
#fallback h1{font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1.45}
#fallback p{margin-top:14px;font-size:14px;letter-spacing:-.3px;line-height:1.7;color:rgba(255,255,255,.68)}
#fallback a{display:block;margin-top:26px;padding:17px 20px;background:#fff;color:#031341;
  border-radius:13px;font-size:16px;font-weight:700;letter-spacing:-.4px;text-decoration:none}
</style>
</head>
<body>

<iframe id="app" title="이미지 명함 정보 입력" allow="camera;clipboard-write"></iframe>

<div id="fallback">
  <div class="in">
    <h1>화면을 불러오지 못했습니다</h1>
    <p>브라우저가 이 화면을 막고 있을 수 있습니다.<br>아래 버튼으로 바로 열어보세요.</p>
    <a id="direct" href="#" target="_blank" rel="noopener">입력 화면 바로 열기</a>
  </div>
</div>

<script>
/* 앱을 이 페이지 안에 끼워 넣는다.
   1) 멤버가 보는 주소가 끝까지 studioduggubi.github.io 로 남는다
   2) 구글 안내 배너가 붙지 않는다
   3) 사파리는 다른 도메인 프레임에 구글 쿠키를 안 보낸다
      → 구글 계정이 여러 개여도 계정 문제가 끼어들지 않는다
   앱 주소는 옆의 app.json 에서 매번 새로 읽는다. 아래 값은 예비용. */
var APP_URL = "https://script.google.com/macros/s/AKfycbx5ZnTQDnJ8Goi5Bh1t9OSRpESxbbn6A02L0qCu-FSjWuC-YJ7UuqB3PfKsMmNjOpNpaQ/exec";

(function () {
  var f = document.getElementById("app");
  var fb = document.getElementById("fallback");
  var direct = document.getElementById("direct");
  var loaded = false;

  f.addEventListener("load", function () { loaded = true; });

  function go(url) {
    direct.href = url;
    f.src = url;
    setTimeout(function () { if (!loaded) fb.className = "on"; }, 8000);
  }

  var url = APP_URL;
  try {
    fetch("app.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && typeof j.url === "string" && j.url.indexOf("http") === 0) url = j.url;
      })
      .catch(function () {})
      .then(function () { go(url); });
  } catch (e) { go(url); }
})();
</script>
</body>
</html>
